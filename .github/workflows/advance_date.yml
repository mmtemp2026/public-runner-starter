name: Public Runner - Advance Date

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runner-advance-date
  cancel-in-progress: false

jobs:
  run-advance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PRIVATE_SCRAPER_REPO: ${{ vars.PRIVATE_SCRAPER_REPO }}
      PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    steps:
      - name: Preflight validation
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in PRIVATE_SCRAPER_REPO PRIVATE_REPO_READ_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY R2_SECRET_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout private scraper repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_SCRAPER_REPO }}
          ref: railway-job
          token: ${{ env.PRIVATE_REPO_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        working-directory: private-src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set DATE_CODE
        run: echo "DATE_CODE=20260925" >> "$GITHUB_ENV"

      - name: Trigger District shard on Railway
        shell: bash
        env:
          RAILWAY_DISTRICT_URL: ${{ secrets.RAILWAY_DISTRICT_URL }}
          DISTRICT_TRIGGER_SECRET: ${{ secrets.DISTRICT_TRIGGER_SECRET }}
          DATE_CODE: ${{ env.DATE_CODE }}
        run: |
          set -uo pipefail
          echo "Triggering District (advance) for $DATE_CODE ..."
          code=$(curl -sS -o /tmp/district.json -w '%{http_code}' -X POST \
            -H "X-Auth: $DISTRICT_TRIGGER_SECRET" --max-time 300 \
            "$RAILWAY_DISTRICT_URL/run-district?mode=advance&date=$DATE_CODE" || echo 000)
          echo "District HTTP $code"; cat /tmp/district.json || true; echo
          if [ "$code" != "200" ]; then
            echo "::warning::District trigger failed (HTTP $code) - combine will use last shard 9 in R2"
          fi
      - name: Run advance scrape
        working-directory: private-src
        env:
          SCRAPE_MODE: advance
          SHARD_IDS: 1-8
          DATE_CODE: ${{ env.DATE_CODE }}
          R2_ACCOUNT_ID: ${{ env.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ env.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ env.R2_SECRET_KEY }}
          R2_BUCKET_NAME: ${{ env.R2_BUCKET_NAME }}
        run: python railway_runner.py

      - name: Verify R2 upload
        working-directory: private-src
        env:
          DATE_CODE: ${{ env.DATE_CODE }}
          R2_ACCOUNT_ID: ${{ env.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ env.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ env.R2_SECRET_KEY }}
          R2_BUCKET_NAME: ${{ env.R2_BUCKET_NAME }}
        run: python verify_r2_outputs.py --mode advance --date "$DATE_CODE"
